<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb"><meta name="description" content="A calm, local-first study dashboard.">
<title>SoroStudy — Soro</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="css/main.css">
</head>
<body><div class="wrap"><header><div><div class="brand">Soro<span>Study</span></div><p class="muted">Make today count, one session at a time.</p></div><span class="pill">YOUR STUDY SPACE</span></header><div class="grid"><section class="panel timer"><p class="eyebrow">FOCUS SESSION</p><div id="clock">25:00</div><div class="controls"><button id="start" class="primary">Start focus</button><button id="reset">Reset</button></div><p class="muted" id="state">Ready when you are.</p><div class="session-meta"><span id="todayStats">0 min studied today</span><span><b id="sessionCount">0</b> completed sessions</span></div></section><section class="panel stat"><p class="eyebrow">TODAY'S FOCUS</p><strong id="total">0 min</strong><p class="muted">Completed focus time</p></section><section class="panel tasks"><p class="eyebrow">TASK LIST</p><form id="taskform"><input id="task" placeholder="Add a study task…" required><button class="primary">Add</button></form><ul id="list"></ul></section></div><footer>Progress is stored locally in this browser.</footer></div>

<script src="js/app.js" defer></script>
</body></html>
